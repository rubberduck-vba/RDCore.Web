name: Build and Test

on:
 push:
  branches: [main]
 pull_request:
  branches: [main]

permissions:
 contents: read

jobs:
 build-and-test:
  runs-on: ubuntu-latest
  timeout-minutes: 20

  steps:
   - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
     with:
      persist-credentials: false

   - name: Setup .NET
     uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
     with:
      dotnet-version: 11.0

   # restore audits every package, the transitive ones included, against nuget.org's advisories (Directory.Build.props): each vulnerable package is an
   # error NU1901-NU1904 that names it, its version and its advisory, and the run stops here. The fix is a version bump of the package.
   - name: Vulnerable packages
     run: dotnet restore RDCore.Web.slnx --force-evaluate

   - name: Build (Debug)
     run: dotnet build RDCore.Web.slnx --configuration Debug --no-restore

   - name: Test (Debug)
     run: dotnet test RDCore.Web.slnx --configuration Debug --no-build --verbosity normal --blame-hang-timeout 10m

   - name: Build (Release)
     run: dotnet build RDCore.Web.slnx --configuration Release

   - name: Test (Release)
     run: dotnet test RDCore.Web.slnx --configuration Release --no-build --verbosity normal --blame-hang-timeout 10m

   # one package per repository: packing the solution makes exactly one, RDCore.Web. A prerelease suffix, as a release tag has, since the package
   # depends on a prerelease RDCore.SDK.
   - name: Pack
     run: |
       dotnet pack RDCore.Web.slnx --configuration Release --no-build -p:VersionSuffix=ci -o packages
       ls packages
       count=$(find packages -name '*.nupkg' | wc -l)
       if [ "$count" -ne 1 ] || [ ! -f packages/RDCore.Web.*-ci.nupkg ]; then
         echo "::error::The solution packs $count package(s); the repository has one, RDCore.Web."
         exit 1
       fi

   # what --blame-hang-timeout leaves when a test hangs: the sequence file and the dumps of the test host.
   - name: Upload what a hang leaves
     if: failure()
     uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
     with:
      name: blame-ubuntu-latest
      path: |
       **/TestResults/**/Sequence_*.xml
       **/TestResults/**/*.dmp
      if-no-files-found: ignore
      retention-days: 3

 # a pull request that adds or bumps a package with a known vulnerability, of any severity, fails here. It needs the repository's dependency graph.
 dependency-review:
  if: github.event_name == 'pull_request'
  runs-on: ubuntu-latest
  timeout-minutes: 10

  steps:
   - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
     with:
      persist-credentials: false

   - name: Dependency review
     uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
     with:
      fail-on-severity: low
