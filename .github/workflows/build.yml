name: Build and Test

# every push and pull request, and each Monday: an advisory published after the last push shows on main within a week.
on:
 push:
 pull_request:
 schedule:
  - cron: '17 6 * * 1'

permissions:
 contents: read

jobs:
 build-and-test:
  runs-on: ubuntu-latest
  timeout-minutes: 20

  steps:
   - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
     with:
      persist-credentials: false

   - name: Setup .NET
     uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
     with:
      dotnet-version: 11.0

   # restore audits every package, the transitive ones included, against nuget.org's advisories of every severity (Directory.Build.props): in CI each
   # vulnerable package is an error NU1901-NU1904 that names it, its version and its advisory, and the run stops here. It needs no repository setting.
   - name: Vulnerable packages
     run: dotnet restore RDCore.Web.slnx --force-evaluate

   - name: Build (Debug)
     run: dotnet build RDCore.Web.slnx --configuration Debug --no-restore

   - name: Test (Debug)
     run: dotnet test RDCore.Web.slnx --configuration Debug --no-build --verbosity normal --blame-hang-timeout 10m

   - name: Build (Release)
     run: dotnet build RDCore.Web.slnx --configuration Release

   - name: Test (Release)
     run: dotnet test RDCore.Web.slnx --configuration Release --no-build --verbosity normal --blame-hang-timeout 10m

   # one package per repository: packing the solution makes exactly one, RDCore.Web. A prerelease suffix, as a release tag has, since the package
   # depends on a prerelease RDCore.SDK.
   - name: Pack
     run: |
       dotnet pack RDCore.Web.slnx --configuration Release --no-build -p:VersionSuffix=ci -o packages
       ls packages
       count=$(find packages -name '*.nupkg' | wc -l)
       if [ "$count" -ne 1 ] || [ ! -f packages/RDCore.Web.*-ci.nupkg ]; then
         echo "::error::The solution packs $count package(s); the repository has one, RDCore.Web."
         exit 1
       fi

   # what --blame-hang-timeout leaves when a test hangs: the sequence file and the dumps of the test host.
   - name: Upload what a hang leaves
     if: failure()
     uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
     with:
      name: blame-ubuntu-latest
      path: |
       **/TestResults/**/Sequence_*.xml
       **/TestResults/**/*.dmp
      if-no-files-found: ignore
      retention-days: 3
